<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="section" id="home">
            <h2>Home</h2>
            <p>Welcome to my personal website!</p>
        </div>

        <div class="section" id="profile">
            <h2>Profile</h2>
            <p>This is my profile information.</p>
        </div>

        <div class="section" id="education">
            <h2>Education</h2>
            <p>This is my education information.</p>
        </div>

        <div class="section" id="experience">
            <h2>Experience</h2>
            <p>This is my experience information.</p>
        </div>

        <div class="section" id="interests">
            <h2>Interests</h2>
            <p>These are my interests.</p>
        </div>

        <div class="section" id="gallery">
            <h2>Gallery</h2>
            <p>This is my gallery.</p>
        </div>

        <div class="section" id="guestbook">
            <h2>Guestbook</h2>
            <form @submit.prevent="submitEntry">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" v-model="newEntry.name" required>
                </div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" v-model="newEntry.message" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
            <ul>
                <li v-for="entry in entries" :key="entry.id">
                    <strong>{{ entry.name }}:</strong> {{ entry.message }}
                </li>
            </ul>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/page/page.mjs"></script>
    <script src="js/script.js"></script>
</body>
</html>
