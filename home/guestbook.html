<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <style>
        /* Reset Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Background for Education Page */
        body {
            background-image: url('https://github.com/MarielleKloieAPC/webprogMI231-personal-website-1/blob/feature/website_finals/home/images/Home3.png?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Content Box */
        .content {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
        }

        /* Floating Menu */
        .menu-container {
            position: fixed; /* Change to fixed positioning */
            top: 50px;   /* Adjust distance from top as needed */
            right: 20px;   /* Adjust distance from left as needed */
            z-index: 20;  /* Ensure it's above other elements */
            transform: translateX(-50%); /* Remove the horizontal centering */
        }


        .menu-button {
            width: 50px;
            height: 50px;
            background-color: #17153b;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-button::before { 
            content: "\2729"; /* Unicode for a four-pointed star */
            color: white;  /* Unicode for a four-pointed star */
        }

        .menu-button.active {
            transform: rotate(45deg);
        }

/* Hidden by Default */
        .menu-items {
            position: absolute;
            top: 70px; /* Position below the button */
            left: 0;    /* Align with the button's left edge */
            display: flex;
            flex-direction: column; /* Arrange items vertically */
            gap: 15px;
            opacity: 0;
            transform: translateY(10px); /* Initial offset downwards */
            pointer-events: none;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .menu-container.open .menu-items {
            opacity: 1;
            transform: translateY(0); /* Remove the offset */
            pointer-events: auto;
        }

        .menu-item {
            width: 50px;
            height: 50px;
            background-color: #17153b;
            color: white;
            font-size: 20px;
            text-align: center;
            line-height: 50px;
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }

        .menu-item:hover {
            background-color: #2e295f;
            transform: scale(1.1);
        }
        .section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 30%;
        }
    </style>
</head>
<body>
    <div id="app" class="content">
        <h2>Guestbook</h2>
        <form @submit.prevent="submitEntry">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" v-model="newEntry.name" required>
            </div>
            <div>
                <label for="message">Message:</label>
                <textarea id="message" v-model="newEntry.message" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
        <ul>
            <li v-for="entry in entries" :key="entry.id">
                <strong>{{ entry.name }}:</strong> {{ entry.message }}
            </li>
        </ul>
    </div>
    
    <div class="menu-container">
        <div class="menu-button" id="menuButton"></div>
        <div class="menu-items">
            <a href="index.html" class="menu-item">🏠</a>
            <a href="edu_exp.html" class="menu-item">🎓</a>
            <a href="interest.html" class="menu-item">❤️</a>
            <a href="gallery.html" class="menu-item">🖼️</a>
            <a href="guestbook.html" class="menu-item">📝</a>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/guestbook.js"></script>
</body>
</html>
