<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        /* Image Styles */
        .gallery-image {
            width: 150px;
            /* Adjust size as needed */
            height: 150px;
            /* Adjust size as needed */
            border-radius: 10px;
            /* Rounded corners */
            object-fit: cover;
            /* Maintain aspect ratio */
            cursor: pointer;
            transition: transform 0.3s ease;
            /* Smooth transition for enlargement */
            margin: 5px;
            /* Spacing between images */
            border: 2px solid transparent;
            /* Transparent border by default */
        }

        .gallery-image:hover {
            border-color: #cfc6e1;
            /* Hover border color */
        }

        .gallery-image.enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            /* Enlarge and center */
            z-index: 1000;
            /* Ensure it's on top */
            border: 2px solid #cfc6e1;
        }

        /* Modal Overlay (Optional, for background dimming when enlarged) */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        /* Gallery Container */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            /* Allows images to wrap to the next line */
            justify-content: center;
            /* Center images horizontally */
            margin-top: 20px;
            /* Add some space above the images */
        }

        /* Rest of your existing CSS */

        body {
            margin: 0;
            font-family: "Baskerville", serif;
            background: url('https://github.com/MarielleKloieAPC/webprogMI231-personal-website-1/blob/feature/website_finals/home/images/Home3.png?raw=true') center/cover no-repeat;
            min-height: 100vh;
            color: white;
            position: relative;
        }

        .content {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            margin: 20px auto;
            overflow-y: auto;
        }

        section h2,
        h3,
        h4,
        p,
        li,
        .paragraph {
            font-family: "Baskerville", serif;
            color: white;
        }

        section h2 {
            font-size: 20px;
            text-align: left;
        }

        h1 {
            border-radius: 2px;
            text-align: center;
            padding: 20px;
            margin: 30px 0 40px;
        }

        h2 {
            border-radius: 2px;
            padding: 10px;
            margin: 10px 0 0 10px;
            text-align: left;
            font-size: 30px;
        }

        h3 {
            padding: 5px;
            margin: 10px 0 0;
            text-align: left;
            font-size: 20px;
        }

        h4 {
            border-radius: 2px;
            padding: 15px;
            margin: 10px 0 0 10px;
            text-align: center;
            font-size: 20px;
            color: #4a2a80;
        }

        p,
        .paragraph {
            font-size: 15px;
            text-align: justify;
            margin: 30px;
            line-height: 1.5;
        }

        .paragraph {
            text-align: left;
            margin: 4px 15px 12px;
        }

        ul {
            list-style-type: square;
        }

        li {
            margin-top: 10px;
            font-size: 15px;
            text-align: left;
        }

        .menu-container {
            position: fixed;
            top: 50px;
            right: 20px;
            z-index: 20;
            transform: translateX(-50%);
        }

        .menu-button {
            width: 50px;
            height: 50px;
            background-color: #17153b;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-button::before {
            content: "\2729";
            color: white;
        }

        .menu-button.active {
            transform: rotate(45deg);
        }

        .menu-items {
            position: absolute;
            top: 70px;
            left: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .menu-container.open .menu-items {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .menu-item {
            width: 50px;
            height: 50px;
            background-color: #17153b;
            color: white;
            font-size: 20px;
            text-align: center;
            line-height: 50px;
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }

        .menu-item:hover {
            background-color: #2e295f;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="content">
        <h2>Gallery</h2>
        <p>
            Placeholder
        </p>
        <div class="gallery-container">
            <img src="home/images/gallery/Image (1).jpg" alt="Image 1" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (1).jpg')">

            <img src="home/images/gallery/Image (3).jpg" alt="Image 3" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (3).jpg')">
            <img src="home/images/gallery/Image (4).jpg" alt="Image 4" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (4).jpg')">
            <img src="home/images/gallery/Image (5).jpg" alt="Image 5" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (5).jpg')">
            <img src="home/images/gallery/Image (6).jpg" alt="Image 6" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (6).jpg')">
            <img src="home/images/gallery/Image (7).jpg" alt="Image 7" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (7).jpg')">
            <img src="home/images/gallery/Image (8).jpg" alt="Image 8" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (8).jpg')">
            <img src="home/images/gallery/Image (9).jpg" alt="Image 9" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (9).jpg')">
            <img src="home/images/gallery/Image (10).jpg" alt="Image 10" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (10).jpg')">
            <img src="home/images/gallery/Image (11).jpg" alt="Image 11" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (11).jpg')">
            <img src="home/images/gallery/Image (12).jpg" alt="Image 12" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (12).jpg')">
            <img src="home/images/gallery/Image (13).jpg" alt="Image 13" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (13).jpg')">
            <img src="home/images/gallery/Image (14).jpg" alt="Image 14" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (14).jpg')">
            <img src="home/images/gallery/Image (15).jpg" alt="Image 15" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (15).jpg')">

            <img src="home/images/gallery/Image (17).jpg" alt="Image 17" class="gallery-image" onclick="enlargeImage('home/images/gallery/Image (17).jpg')">
        </div>
    </div>

    <div class="menu-container">
        <div class="menu-button" id="menuButton"></div>
        <div class="menu-items">
            <a href="index.html" class="menu-item">🏠</a>
            <a href="edu_exp.html" class="menu-item">🎓</a>
            <a href="interest.html" class="menu-item">❤️</a>
            <a href="gallery.html" class="menu-item">🖼️</a>
            <a href="guestbook.html" class="menu-item">📝</a>
        </div>
    </div>

    <script>
        function enlargeImage(imageUrl) {
            const image = new Image();
            image.src = imageUrl;
            image.classList.add('gallery-image', 'enlarged');

            const overlay = document.createElement('div');
            overlay.classList.add('overlay');
            overlay.classList.add('active');

            overlay.addEventListener('click', () => {
                document.body.removeChild(image);
                document.body.removeChild(overlay);
            });

            document.body.appendChild(image);
            document.body.appendChild(overlay);
        }

        document.addEventListener("DOMContentLoaded", function () {
            const menuButton = document.getElementById("menuButton");
            const menuContainer = document.querySelector(".menu-container");

            menuButton.addEventListener("click", function () {
                menuContainer.classList.toggle("open");
                menuButton.classList.toggle("active");
            });
        });
    </script>
</body>
</html>
