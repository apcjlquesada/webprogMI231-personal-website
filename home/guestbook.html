<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <style>
    body {
    margin: 0;
    font-family: "Baskerville", serif;
    background: url('https://github.com/MarielleKloieAPC/webprogMI231-personal-website-1/blob/feature/website_finals/home/images/Home3.png?raw=true') center/cover no-repeat;
    min-height: 100vh;
    color: white;
    position: relative;
}

.content {
    background: rgba(0, 0, 0, 0.5);
    padding: 20px;
    border-radius: 10px;
    max-width: 600px;
    width: 90%;
    margin: 20px auto;
    overflow-y: auto;
}

section h2, h3, h4, p, li, .paragraph {
    font-family: "Baskerville", serif;
    color: white;
}

section h2 {
    font-size: 20px;
    text-align: left;
}

h1 {
    border-radius: 2px;
    text-align: center;
    padding: 20px;
    margin: 30px 0 40px;
}

h2 {
    border-radius: 2px;
    padding: 10px;
    margin: 10px 0 0 10px;
    text-align: left;
    font-size: 30px;
}

h3 {
    padding: 5px;
    margin: 10px 0 0;
    text-align: left;
    font-size: 20px;
}

h4 {
    border-radius: 2px;
    padding: 15px;
    margin: 10px 0 0 10px;
    text-align: center;
    font-size: 20px;
    color: #4a2a80;
}

p, .paragraph {
    font-size: 15px;
    text-align: justify;
    margin: 30px;
    line-height: 1.5;
}

.paragraph {
    text-align: left;
    margin: 4px 15px 12px;
}

ul {
    list-style-type: square;
}

li {
    margin-top: 10px;
    font-size: 15px;
    text-align: left;
}

.menu-container {
    position: fixed;
    top: 50px;
    right: 20px;
    z-index: 20;
    transform: translateX(-50%);
}

.menu-button {
    width: 50px;
    height: 50px;
    background-color: #17153b;
    color: white;
    font-size: 30px;
    text-align: center;
    line-height: 50px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
}

.menu-button::before {
    content: "\2729";
    color: white;
}

.menu-button.active {
    transform: rotate(45deg);
}

.menu-items {
    position: absolute;
    top: 70px;
    left: 0;
    display: flex;
    flex-direction: column;
    gap: 15px;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
}

.menu-container.open .menu-items {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.menu-item {
    width: 50px;
    height: 50px;
    background-color: #17153b;
    color: white;
    font-size: 20px;
    text-align: center;
    line-height: 50px;
    border-radius: 50%;
    text-decoration: none;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.3s ease-in-out, background-color 0.3s ease-in-out;
}

.menu-item:hover {
    background-color: #2e295f;
    transform: scale(1.1);
}

        .section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            color: white;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 30%;
        }
    </style>
</head>
<body>
    <div id="app" class="content">
        <h2>Guestbook</h2>
        <form @submit.prevent="submitEntry">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" v-model="newEntry.name" required>
            </div>
            <div>
                <label for="message">Message:</label>
                <textarea id="message" v-model="newEntry.message" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
        <ul>
            <li v-for="entry in entries" :key="entry.id">
                <strong>{{ entry.name }}:</strong> {{ entry.message }}
            </li>
        </ul>

        <div class="menu-container" :class="{ open: menuOpen }">
            <div class="menu-button" @click="toggleMenu" :class="{ active: menuActive }"></div>
            <div class="menu-items">
                <a href="index.html" class="menu-item">🏠</a>
                <a href="edu_exp.html" class="menu-item">🎓</a>
                <a href="interest.html" class="menu-item">❤️</a>
                <a href="gallery.html" class="menu-item">🖼️</a>
                <a href="guestbook.html" class="menu-item">📝</a>
            </div>
        </div>

        <div id="successModal" class="modal">
            <div class="modal-content">
                <p>Message successfully submitted!</p>
                <button @click="closeModal">Close</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="guestbook.js"></script>
</body>
</html>
